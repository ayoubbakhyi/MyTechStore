services:
  app:
    build: .
    ports:
      - "8081:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: mytechstore
      DB_USER: root
      DB_PASSWORD: rootpass
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: mytechstore
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"

volumes:
  db-data: